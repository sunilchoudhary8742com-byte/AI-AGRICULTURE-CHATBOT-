<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2e1d" />
      <stop offset="50%" stop-color="#14532d" />
      <stop offset="100%" stop-color="#051f12" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b4d32" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f3420" stop-opacity="0.8" />
    </linearGradient>

    <!-- Emerald Glow Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="50%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Filter for neon glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes floatReverse {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(8px) rotate(-4deg); }
    }
    @keyframes scanline {
      0% { transform: translateY(0); opacity: 0.1; }
      50% { opacity: 0.4; }
      100% { transform: translateY(340px); opacity: 0.1; }
    }
    @keyframes shimmer {
      0% { stop-color: #22c55e; }
      50% { stop-color: #86efac; }
      100% { stop-color: #22c55e; }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }

    .pulsing-glow {
      animation: pulse 4s ease-in-out infinite;
      transform-origin: center;
    }
    .floating-card-1 {
      animation: float 5s ease-in-out infinite;
    }
    .floating-card-2 {
      animation: floatReverse 6s ease-in-out infinite;
    }
    .floating-card-3 {
      animation: float 7s ease-in-out infinite 1s;
    }
    .scan-beam {
      animation: scanline 4s linear infinite;
    }
    .animated-border {
      stroke-dasharray: 8, 8;
      animation: dash 2s linear infinite;
    }
    .title-text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .sub-text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 400;
      letter-spacing: 0.2px;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="20" fill="url(#bgGrad)" />

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="180" r="160" fill="#22c55e" opacity="0.15" filter="url(#neonGlow)" class="pulsing-glow" />
  <circle cx="1050" cy="180" r="180" fill="#10b981" opacity="0.12" filter="url(#neonGlow)" class="pulsing-glow" style="animation-delay: 2s;" />

  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Animated Border Outline -->
  <rect x="4" y="4" width="1192" height="352" rx="18" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.4" class="animated-border" />

  <!-- LEFT: Hero Branding & Title -->
  <g transform="translate(60, 60)">
    <!-- Badge -->
    <rect x="0" y="0" width="220" height="32" rx="16" fill="#1b4332" stroke="#4ade80" stroke-width="1" />
    <circle cx="16" cy="16" r="5" fill="#4ade80" class="pulsing-glow" />
    <text x="30" y="21" fill="#86efac" font-size="12" font-family="'Segoe UI', sans-serif" font-weight="600" letter-spacing="1">NEXT-GEN AGRI-TECH</text>

    <!-- Main Title -->
    <text x="0" y="85" fill="#ffffff" font-size="44" class="title-text">
      AI AGRICULTURE <tspan fill="url(#glowGrad)">ASSISTANT</tspan>
    </text>
    <text x="0" y="125" fill="#a7f3d0" font-size="24" class="title-text" opacity="0.95">
      Kisan Sahayak • Intelligent Farming Companion
    </text>

    <!-- Description -->
    <text x="0" y="165" fill="#cbd5e1" font-size="14.5" class="sub-text">
      Empowering farmers with Soil-to-Crop Machine Learning, Computer Vision Pathology,
    </text>
    <text x="0" y="188" fill="#cbd5e1" font-size="14.5" class="sub-text">
      Agro-Meteorological Forecasts, and Personalized Soil Nutrient Advisory.
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 218)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="140" height="28" rx="8" fill="#14532d" stroke="#22c55e" stroke-width="1" />
      <text x="12" y="18" fill="#bbf7d0" font-size="12" font-family="'Segoe UI', sans-serif" font-weight="600">🌱 Crop AI Recommender</text>

      <!-- Tag 2 -->
      <rect x="150" y="0" width="145" height="28" rx="8" fill="#14532d" stroke="#22c55e" stroke-width="1" />
      <text x="12" y="18" fill="#bbf7d0" font-size="12" font-family="'Segoe UI', sans-serif" font-weight="600" transform="translate(150, 0)">🔍 Vision Pathology (CNN)</text>

      <!-- Tag 3 -->
      <rect x="305" y="0" width="125" height="28" rx="8" fill="#14532d" stroke="#22c55e" stroke-width="1" />
      <text x="12" y="18" fill="#bbf7d0" font-size="12" font-family="'Segoe UI', sans-serif" font-weight="600" transform="translate(305, 0)">🌦️ Weather Intelligence</text>

      <!-- Tag 4 -->
      <rect x="440" y="0" width="125" height="28" rx="8" fill="#14532d" stroke="#22c55e" stroke-width="1" />
      <text x="12" y="18" fill="#bbf7d0" font-size="12" font-family="'Segoe UI', sans-serif" font-weight="600" transform="translate(440, 0)">🔒 Secure Farmer Auth</text>
    </g>
  </g>

  <!-- RIGHT: Dynamic Interactive Floating Feature Cards -->
  <!-- Card 1: Soil & Crop Recommender (Top Right) -->
  <g class="floating-card-1" transform="translate(800, 35)">
    <rect width="340" height="88" rx="14" fill="url(#cardGrad)" stroke="#22c55e" stroke-width="1.2" opacity="0.95" />
    <circle cx="45" cy="44" r="24" fill="#166534" />
    <text x="32" y="52" font-size="24">🌾</text>
    <text x="82" y="36" fill="#f8fafc" font-size="15" font-family="'Segoe UI', sans-serif" font-weight="700">Random Forest Classifier</text>
    <text x="82" y="56" fill="#86efac" font-size="12.5" font-family="'Segoe UI', sans-serif">99.3% Accuracy • NPK + Climate</text>
    <rect x="82" y="66" width="190" height="6" rx="3" fill="#052e16" />
    <rect x="82" y="66" width="180" height="6" rx="3" fill="url(#glowGrad)" />
  </g>

  <!-- Card 2: MobileNetV2 Vision Leaf Pathology (Middle Right) -->
  <g class="floating-card-2" transform="translate(830, 138)">
    <rect width="330" height="88" rx="14" fill="url(#cardGrad)" stroke="#4ade80" stroke-width="1.2" opacity="0.95" />
    <circle cx="45" cy="44" r="24" fill="#166534" />
    <text x="32" y="52" font-size="24">🔬</text>
    <text x="82" y="36" fill="#f8fafc" font-size="15" font-family="'Segoe UI', sans-serif" font-weight="700">MobileNetV2 Vision CNN</text>
    <text x="82" y="56" fill="#a7f3d0" font-size="12.5" font-family="'Segoe UI', sans-serif">15 Disease Classes • 224x224 RGB</text>
    <text x="82" y="73" fill="#fbbf24" font-size="11" font-family="'Segoe UI', sans-serif" font-weight="600">⚡ Instant Diagnostics &amp; Cure</text>
  </g>

  <!-- Card 3: Agro-Meteorological Radar (Bottom Right) -->
  <g class="floating-card-3" transform="translate(790, 240)">
    <rect width="350" height="85" rx="14" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2" opacity="0.95" />
    <circle cx="45" cy="42" r="24" fill="#166534" />
    <text x="32" y="50" font-size="24">⛅</text>
    <text x="82" y="34" fill="#f8fafc" font-size="15" font-family="'Segoe UI', sans-serif" font-weight="700">Live Weather &amp; 5-Day Radar</text>
    <text x="82" y="54" fill="#6ee7b7" font-size="12.5" font-family="'Segoe UI', sans-serif">Temperature, Humidity &amp; Rain mm</text>
    <text x="82" y="71" fill="#93c5fd" font-size="11" font-family="'Segoe UI', sans-serif">📍 Hyperlocal API Integration</text>
  </g>
</svg>
